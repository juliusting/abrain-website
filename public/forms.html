<!DOCTYPE html>
<html>
<head><title>Forms</title></head>
<body>
<!-- Netlify form definition — required for @netlify/plugin-nextjs v5 detection -->
<form name="fastev-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="fastev-inquiry" />
  <input name="bot-field" />
  <input name="name" />
  <input name="company" />
  <select name="property_type"></select>
  <input name="parking_bays" />
  <input name="phone" type="tel" />
  <input name="email" type="email" />
  <textarea name="message"></textarea>
</form>
</body>
</html>
